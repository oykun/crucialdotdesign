lockup.", "clearSpace": 0.5, "clearSpaceNote": "Keep clear space of x on every side, where x is half the height of the symbol. Nothing goes inside it: no text, no edge of the screen, no other logo. On a busy page, give it more.", "minSize": {"lockup": 24, "symbol": 16}, "minSizeNote": "The lockup stays at 24px tall or more on screen (12mm in print). Below that, switch to the symbol, which holds down to 16px.", "misuseNote": "Use the supplied files as they are. If a layout seems to need a change to the logo, change the layout.", "animation": {"note": "The four petals turn into place around the centre, then the name follows. Use it for video intros, the site loader and the end card of a reel. Play it once, never on a loop behind content.", "duration": 3}}, "palette": [{"id": "orange", "name": "Orange", "hex": "#FF4500", "token": "--accent", "share": 10, "role": "The brand colour. Primary buttons, kickers, highlights, the one thing on the page you should notice first."}, {"id": "ink", "name": "Ink", "hex": "#0A0A0A", "token": "--dark", "share": 30, "role": "Dark blocks, hero sections, secondary buttons and body text on light."}, {"id": "white", "name": "White", "hex": "#FFFFFF", "token": "--page", "share": 45, "role": "The page. Always the page. Dark is a block on white, never the page itself."}, {"id": "soft", "name": "Soft", "hex": "#F5F5F5", "token": "--soft", "share": 10, "role": "Cards and panels on white. Depth comes from this contrast, never from shadows."}, {"id": "muted", "name": "Muted", "hex": "#7D7D7D", "token": "--muted", "share": 5, "role": "Secondary text on light. Use at 18px and up, see readable combinations."}], "paletteNotes": ["Orange is the signal. It earns attention because there is so little of it: one primary button, a kicker, a highlight. If two things on a page are orange, one of them is wrong.", "Ink and White do the work. Build each page as white with near-black rounded blocks for the moments that matter: the hero, the call to action, a feature. Soft gives cards their edge without a border or a shadow."], "proportionNotes": ["White carries most of every page, Ink gives it weight and Orange is a small, loud share on top. Soft and Muted are supporting tones for cards and secondary text.", "Use this as a starting point across a set of pages. A single campaign tile can go full Orange or full Ink, and it still belongs, as long as the overall impression stays white, dark and one orange."], "contrast": {"pairs": [["ink", "white"], ["white", "ink"], ["ink", "soft"], ["white", "orange"], ["ink", "orange"], ["orange", "ink"], ["orange", "white"], ["muted", "white"]], "note": "Ink on White and White on Ink pass everything. Orange is a large-text and button colour: white on orange holds for 16px semibold button labels and anything 24px and up, but never for body copy. Muted on White falls just short of AA for small text, so keep it to 18px ledes and captions people don't need to read."}, "fonts": [{"name": "Instrument Serif", "family": "'Instrument Serif', serif", "weights": "400", "url": "https://fonts.google.com/specimen/Instrument+Serif", "licence": "SIL Open Font License, free for commercial use", "note": "One serif moment per page: the H1. It carries the voice. Let it have room, and never set a section heading or a button in it."}, {"name": "Instrument Sans", "family": "'Instrument Sans', sans-serif", "weights": "600 · 700", "url": "https://fonts.google.com/specimen/Instrument+Sans", "licence": "SIL Open Font License, free for commercial use", "note": "Everything structural: section headings, card titles and the wordmark. 700 for H2, 600 for H3 and the name in the lockup. Tight tracking, -0.015em."}, {"name": "Inter", "family": "'Inter', sans-serif", "weights": "400 · 500 · 600", "url": "https://fonts.google.com/specimen/Inter", "licence": "SIL Open Font License, free for commercial use", "note": "Reading. Body at 16px, line height 1.6, ledes at 17 to 18px in Muted. 600 for kickers, sentence case, in Orange."}], "fontsCss": "https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap", "scale": [{"label": "Display", "font": "Instrument Serif", "weight": 400, "size": 56, "lh": 1.08, "tracking": "-0.015em", "sample": "You are good at design."}, {"label": "Heading 1", "font": "Instrument Serif", "weight": 400, "size": 44, "lh": 1.08, "tracking": "-0.015em", "sample": "Stop figuring it out alone."}, {"label": "Heading 2", "font": "Instrument Sans", "weight": 700, "size": 40, "lh": 1.1, "tracking": "-0.015em", "sample": "What you'll build inside"}, {"label": "Heading 3", "font": "Instrument Sans", "weight": 600, "size": 22, "lh": 1.25, "tracking": "-0.01em", "sample": "Monthly live Q&A call"}, {"label": "Lede", "font": "Inter", "weight": 400, "size": 18, "lh": 1.6, "tracking": "0", "sample": "Start with the free membership. Get in the room with 1,000 designers.", "colour": "muted"}, {"label": "Body", "font": "Inter", "weight": 400, "size": 16, "lh": 1.6, "tracking": "0", "sample": "You learn why something works, then you install a system that does it."}, {"label": "Kicker", "font": "Inter", "weight": 600, "size": 14, "lh": 1.4, "tracking": "0", "sample": "Mastery Membership", "colour": "orange"}], "scaleNote": "Mobile drops Display to 36px and Heading 2 to 30px. Everything else holds. The jump from serif headline to sans structure does the work, so the scale itself stays quiet.", "voice": {"summary": "Designer Mindset sounds like a designer who has run the business side for 25 years and still remembers not knowing how. Direct, warm, a bit cheeky. Plain truths, never promises. The reader has been burned by course sellers before, and one whiff of guru undoes everything else.", "examples": [{"label": "Signature", "text": "👀"}, {"label": "Short headline", "text": "You are good at design."}, {"label": "Headline", "text": "If you're a designer… Stop figuring out the business side to $100K+ alone."}, {"label": "Brand statement", "text": "1,000+ designers building a business from their design skills, together."}, {"label": "Call to action", "text": "Join us. Free"}], "rules": [{"title": "Say the plain truth", "line": "Name the gap. Don't sell the dream.", "say": ["You are good at design. The business side is the gap.", "Most designers undercharge. Here's why.", "I priced my first retainer too low too."], "avoid": ["Unlock your creative potential.", "Transform your design career today.", "The ultimate blueprint for success."]}, {"title": "A practitioner, never a guru", "line": "Show the work, the desk, the numbers. No hype.", "say": ["Here's the proposal that won the retainer.", "This is what I'd charge for that.", "Ask it in the community, someone has been there."], "avoid": ["6 figures in 90 days.", "My students made $X last month!", "Only 3 spots left, offer ends tonight."]}, {"title": "Short, sentence case, human", "line": "Sentence case everywhere. No em dashes. Say it in fewer words.", "say": ["Join Free", "Mastery Membership", "See inside"], "avoid": ["JOIN NOW", "Ready to supercharge your journey?", "Leverage our ecosystem of resources."]}], "product": [{"context": "Buttons", "say": "Join Free · See inside · Book a call", "avoid": "Submit · Click here · Get started now!"}, {"context": "Errors", "say": "That email is already in. Log in instead?", "avoid": "Error 409: user exists."}, {"context": "Empty states", "say": "No posts yet. Ask the first question, someone has been there.", "avoid": "Nothing to see here!"}, {"context": "Success", "say": "You're in. Your first call is Thursday.", "avoid": "Congratulations!!! 🎉 Welcome aboard!"}, {"context": "Emails", "say": "Subject: Your pricing call is tomorrow", "avoid": "Subject: Don't miss out!!!"}]}, "social": {"note": "Use the approved headers with the symbol as the profile picture. Orange is the default avatar field; Ink and White are approved alternatives when a platform's own interface needs a different contrast. The name always sits next to the avatar on every platform, so the avatar is the symbol alone.", "headers": [{"file": "social/x-header.png", "label": "X header", "size": "1500 × 500"}, {"file": "social/linkedin-company.png", "label": "LinkedIn company", "size": "1128 × 191"}, {"file": "social/linkedin-personal.png", "label": "LinkedIn personal", "size": "1584 × 396"}, {"file": "social/youtube-banner.png", "label": "YouTube banner", "size": "2560 × 1440"}, {"file": "social/og-image.png", "label": "Link preview (OG)", "size": "1200 × 630"}], "headline": "Stop figuring out the business side alone.", "profiles": [{"platform": "X", "header": "social/x-header.png", "name": "Designer Mindset", "link": "designermindset.net", "bio": "1,000+ designers building a business from their design skills, together. Free to join."}, {"platform": "LinkedIn", "header": "social/linkedin-company.png", "name": "Designer Mindset", "link": "designermindset.net", "bio": "Learn the business side of design: pricing, clients, positioning. Community and Six-Figure Designer programme."}, {"platform": "YouTube", "header": "social/youtube-banner.png", "name": "Designer Mindset", "link": "designermindset.net", "bio": "Live Q&A calls and breakdowns on pricing, proposals and clients."}], "avatars": [{"platform": "X", "size": 400}, {"platform": "LinkedIn", "size": 400}, {"platform": "Instagram", "size": 320}, {"platform": "YouTube", "size": 800}, {"platform": "Threads and Bluesky", "size": 400}], "avatarNote": "Every platform crops the avatar to a circle, so the symbol sits at 46% of the square with room around it. Upload the PNG for each platform at its own size, or the 1000px master anywhere.", "bannerNote": "Platforms cover part of the header with the avatar and buttons: bottom left on X and LinkedIn, everything outside the centre on YouTube. The text sits in the safe area of each, so the files work as they are."}, "applications": [{"file": "applications/site-home.jpg", "title": "Homepage", "caption": "The dark block is the signature. Hero, call to action and feature moments go dark, inside a rounded block that never touches the edge of the screen."}, {"file": "applications/site-mastery.jpg", "title": "Offer page", "caption": "One orange button per view. The serif headline makes the claim, the sans structure and soft cards carry the detail."}, {"file": "applications/site-mobile.jpg", "title": "On mobile", "caption": "Blocks keep their rounding at 28px, buttons go full width, the headline drops to 36px. Nothing else changes."}], "applicationsNote": "Recognition comes from a few things used with confidence: the white page, the dark block, one orange and the serif headline. The scale changes across formats; the relationship between them stays the same.", "rules": ["No gradients, no glassmorphism, no shadows.", "No thin bordered cards. Cards are borderless soft blocks.", "No full dark mode. Dark is a block on a white page.", "No decorative illustration. Real screenshots and real photos only.", "No all-caps labels. Kickers are sentence case, Orange, 600.", "No square buttons, no outline orange buttons. Pills, always."], "story": {"oneLiner": "Designer Mindset helps designers turn a design skill into a business.", "items": [{"label": "Who it's for", "text": "The freelancer without a system. Around 38, four years in, feast or famine. Charges day rates, knows they're undercharging, and doesn't know how to say a bigger number. Already has clients, so the pain is weekly."}, {"label": "The promise", "text": "Learn the business side once in the Six-Figure Designer programme, then run it every week in Agency Operator, next to other designers."}, {"label": "Proof", "text": "1,000+ designers in the community. Every lesson comes from 25 years of running a design business, not from a course template."}, {"label": "Sits next to", "text": "Cursor for short, declarative copy. 37signals for practitioners teaching business with opinions. Linear for tool-grade precision."}, {"label": "Against", "text": "Guru course sites (big face, yellow highlighter, countdown timers). Agency templates (\"we craft digital experiences\"). SaaS defaults (purple gradients, glassy cards, \"AI-powered\" badges)."}]}, "imagery": {"note": "The person is the product, so real photos of Oykun are part of the system. Always a practitioner at work: the desk, the laptop, the whiteboard, a live call. Real screenshots of the community and the tools do the rest.", "photos": [{"file": "imagery/at-work-desk.jpg", "caption": "At work, with the work visible. Natural light, the real desk, nothing staged."}, {"file": "imagery/at-work-thames.jpg", "caption": "Out of the office still means working. The laptop is in frame."}, {"file": "imagery/live-calls.jpg", "caption": "Real product and real members. Screenshots beat illustrations."}, {"file": "imagery/portrait-studio.jpg", "caption": "Portraits are calm and full length or half length, never a big-face thumbnail."}], "do": ["Practitioner at work: desk, laptop, sketch, whiteboard, call", "Natural light and real places", "Real screenshots of the community, the programme and Agency Operator", "Real member avatars, with permission"], "dont": ["Big face with yellow text on top", "Pointing at the camera or at a number", "Luxury props: cars, watches, beaches, cash", "Stock photos of people in meetings", "Decorative illustration or AI-generated scenes"]}, "ui": {"note": "The interface is built from the same tokens as the brand. White page, rounded dark blocks for the moments that matter, borderless soft cards and pill buttons. Depth comes from contrast and rounding, never from shadows.", "components": [{"name": "Buttons on light", "bg": "white", "note": "Pills, always. Primary is Orange, secondary is Ink. 20/48 padding on desktop, 16/32 on mobile, Inter 600 at 16px. One primary per view.", "html": "<div style=\"display:flex;flex-wrap:wrap;gap:10px\"><a style=\"display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
