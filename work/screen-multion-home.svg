<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1154 1442" width="1154" height="1442">
<rect width="1154" height="1442" fill="#0a0a0a"/>
<svg x="300.5" y="120.0" width="553" height="1202" viewBox="1486 199 553 1202" font-family="-apple-system, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- MultiOn 1: sign-in and home. Animated version of multion-1.svg, 18 Oct 2026. Photos redrawn as flat shapes. -->
  <style>
    .turn{transform-origin:591px 800px;transform:rotate(-2deg) skewX(-10deg) scale(.94,1);animation:turn 9s ease-in-out infinite alternate}
    @keyframes turn{to{transform:rotate(-.5deg) skewX(-3deg) scale(.99,1)}}
    .depth{animation:depth 9s ease-in-out infinite alternate}
    @keyframes depth{to{transform:translate(-8px,-5px)}}
    .flow{animation:flow 36s linear infinite}
    @keyframes flow{to{transform:translateY(-1740px)}}
    .sheet{transform:translateY(460px);animation:sheet 1.1s cubic-bezier(.22,1,.36,1) .6s forwards}
    @keyframes sheet{to{transform:none}}
    .dimin{opacity:0;animation:dimin .8s ease .6s forwards}
    @keyframes dimin{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.turn,.depth,.flow,.sheet,.dimin{animation:none}.sheet{transform:none}.dimin{opacity:1}}
  </style>
  <defs>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#e4e4e6"/><stop offset="1" stop-color="#e4e4e6" stop-opacity="0"/></linearGradient>
    <clipPath id="phoneL"><rect x="314" y="200" width="554" height="1200"/></clipPath>
    <clipPath id="phoneR"><rect x="1486" y="199" width="553" height="1202"/></clipPath>
    <linearGradient id="dim" gradientUnits="userSpaceOnUse" x1="0" y1="860" x2="0" y2="1400"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".19" stop-color="#000" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".07"/></linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="-6" stdDeviation="18" flood-color="#000" flood-opacity=".08"/></filter>
    <g id="status"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M33 3.5a10 10 0 0 1 12 0l-1.6 1.7a7.6 7.6 0 0 0-8.8 0zM35.6 6.4a6 6 0 0 1 6.8 0l-1.6 1.7a3.6 3.6 0 0 0-3.6 0zM39 9.6l1.7 1.8-1.7 1.6-1.7-1.6z"/><rect x="50" y="1.5" width="18" height="10" rx="3" fill="none" stroke="#111"/><rect x="52" y="3.5" width="14" height="6" rx="1.5"/></g>
    <g id="mic"><rect x="4" y="0" width="8" height="14" rx="4" fill="#111"/><path d="M1 10a7 7 0 0 0 14 0M8 17v5" stroke="#111" stroke-width="2" fill="none"/></g>
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f2f4"/><stop offset=".55" stop-color="#e2e2e6"/><stop offset="1" stop-color="#d2d2d7"/></linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>



  <style>
    .c1{animation:f1 6s ease-in-out infinite}.c2{animation:f1 6s ease-in-out -3s infinite}
    @keyframes f1{0%,100%{translate:0 0}50%{translate:0 -8px}}
    .ph{animation:ph 12s linear infinite}
    @keyframes ph{0%,5%{opacity:1}6%,95%{opacity:0}96%,100%{opacity:1}}
    .cover{transform-box:fill-box;transform-origin:100% 50%;animation:cover 12s infinite}
    @keyframes cover{0%,7%{scale:1 1;animation-timing-function:steps(34,end)}35%,100%{scale:0 1}}
    .typed{animation:typed 12s infinite}
    @keyframes typed{0%,39%{opacity:1;translate:0 0}46%{opacity:0;translate:0 -24px}47%,100%{opacity:0;translate:0 0}}
    .new{animation:nw 12s cubic-bezier(.22,1,.36,1) infinite}
    @keyframes nw{0%,44%{opacity:0;translate:0 -12px}52%,88%{opacity:1;translate:0 0}94%,100%{opacity:0;translate:0 0}}
    .shift{animation:sh 12s cubic-bezier(.22,1,.36,1) infinite}
    @keyframes sh{0%,42%{translate:0 0}50%,88%{translate:0 58px}96%,100%{translate:0 0}}
    .yest{animation:ye 12s infinite}
    @keyframes ye{0%,40%{opacity:1}46%,90%{opacity:0}96%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.c1,.c2,.ph,.cover,.typed,.new,.shift,.yest{animation:none}.typed,.new{opacity:0}.cover{display:none}}
  </style>
  <!-- RIGHT: home -->
  <rect x="1485" y="198" width="555" height="1204" fill="#fff"/>
  <g clip-path="url(#phoneR)">
    <text x="1555" y="251" font-size="26" font-weight="600" fill="#111">9:41</text>
    <use href="#status" transform="translate(1885 232) scale(1.54)" fill="#111"/>
    <!-- Oykun's avatar (avatar.jpg, embedded) -->
    <clipPath id="av"><circle cx="2006" cy="307" r="22"/></clipPath>
    <image href="data:image/jpeg;base64," x="1984" y="285" width="44" height="44" clip-path="url(#av)"/>

    <text x="1510" y="381" font-size="40" font-weight="700" fill="#111" letter-spacing="-.4">Good evening, Oykun</text>
    <text x="1510" y="420" font-size="22" fill="#111">Your Personal AI Assistant</text>

    <!-- trip suggestion -->
    <g class="c1" transform="rotate(1.5 1672 645)">
      <rect x="1512" y="477" width="320" height="335" rx="52" fill="none" stroke="#8b7cf6" stroke-width="6" opacity=".2" filter="url(#glow)"/>
      <rect x="1512" y="477" width="320" height="335" rx="52" fill="#fff" stroke="#8b7cf6" stroke-width="2"/>
      <text x="1548" y="530" font-size="16" font-weight="500" letter-spacing=".6" fill="#8b7cf6">TRIP SUGGESTION</text>
      <rect x="1542" y="612" width="68" height="68" rx="18" fill="#efedfd"/>
      <g stroke="#7d6ff0" stroke-width="2.5" fill="none" stroke-linecap="round"><circle cx="1576" cy="646" r="9"/><path d="M1576 631v5M1576 656v5M1561 646h5M1586 646h5"/></g>
      <circle cx="1576" cy="646" r="3" fill="#7d6ff0"/>
      <text font-size="21" fill="#1c1c1e"><tspan x="1540" y="715">Help me think of ideas of</tspan><tspan x="1540" y="744">things to do in NYC when I</tspan><tspan x="1540" y="773">am free.</tspan></text>
    </g>
    <!-- shopping suggestion -->
    <g class="c2" transform="rotate(0.5 2010 647)">
      <rect x="1860" y="481" width="300" height="332" rx="52" fill="none" stroke="#2db3a0" stroke-width="6" opacity=".2" filter="url(#glow)"/>
      <rect x="1860" y="481" width="300" height="332" rx="52" fill="#fff" stroke="#2db3a0" stroke-width="2"/>
      <text x="1885" y="532" font-size="16" font-weight="500" letter-spacing=".6" fill="#2db3a0">SHOPPING SUGGESTION</text>
      <rect x="1887" y="617" width="66" height="66" rx="18" fill="#dcf6f2"/>
      <text x="1920" y="654" font-size="30" font-weight="700" text-anchor="middle" fill="#1f9e8c">a</text>
      <path d="M1906 662 Q 1920 671 1934 661 M1930 658l5 3-3 4" stroke="#1f9e8c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text font-size="21" fill="#1c1c1e"><tspan x="1888" y="716">Buy the book Zen and the Art</tspan><tspan x="1888" y="743">in my Amazon Cart and</tspan><tspan x="1888" y="770">deliver to my Home.</tspan></text>
    </g>

    <text x="1510" y="902" font-size="30" font-weight="600" fill="#111" letter-spacing="-.2">Your Recent Asks</text>
    <text x="1510" y="958" font-size="16" letter-spacing=".6" fill="#8e8e93">TODAY</text>
    <text class="new" x="1510" y="1014" font-size="22" fill="#111">Things to do in NYC when I am free</text>
    <g class="shift">
    <text x="1510" y="1014" font-size="22" fill="#111">Order me Meditations book from Amazon</text>
    <text font-size="22" fill="#111"><tspan x="1510" y="1072">Book a one-way flight from sfo to nyc for this</tspan><tspan x="1510" y="1104">sat on google flights</tspan></text>
    </g>
    <g class="yest">
    <text x="1510" y="1172" font-size="16" letter-spacing=".6" fill="#8e8e93">YESTERDAY</text>
    <text x="1510" y="1227" font-size="22" fill="#111">Reserve a table at fogo de chão in san jose</text>
    </g>

    <rect x="1497" y="1283" width="531" height="59" rx="29.5" fill="#fff" stroke="#d1d1d6" stroke-width="1.5"/>
    <text class="typed" x="1520" y="1320" font-size="22" fill="#111">Things to do in NYC when I am free</text>
    <rect class="cover" x="1514" y="1294" width="440" height="40" fill="#fff"/>
    <text class="ph" x="1520" y="1320" font-size="22" fill="#a1a1a6">Ask me to do anything</text>
    <use href="#mic" transform="translate(1983 1302)"/>
    <rect x="1665" y="1384" width="195" height="6" rx="3" fill="#111"/>
  </g>
</svg>
</svg>
